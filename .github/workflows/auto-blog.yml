name: Publicação Automatizada de Artigos (EVI Blog IA)

on:
  schedule:
    # Executa toda terça e quinta-feira às 10:00 BRT (13:00 UTC)
    - cron: '0 13 * * 2,4'
  workflow_dispatch:
    # Permite disparo manual no painel do GitHub a qualquer momento

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Motor Editorial IA (NVIDIA NIM + Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.2-11b-vision-instruct' }}
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/generate-article.ts
