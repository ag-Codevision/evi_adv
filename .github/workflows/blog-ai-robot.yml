name: Robô Editorial de IA - EVI Advogados

on:
  schedule:
    # Acorda a cada 30 minutos para checar se há agendamento editorial pendente para o horário atual
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Permite disparar manualmente pelo painel do GitHub Actions
    inputs:
      force:
        description: 'Forçar publicação imediata (ignora dia e horário agendado)'
        required: false
        type: boolean
        default: false

jobs:
  trigger-editorial-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Chamar endpoint de automação no site em produção
        run: |
          # Token oficial com fallback caso não esteja salvo nos Secrets do GitHub
          SECRET_TOKEN="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET_TOKEN" ]; then
            SECRET_TOKEN="c593749da9104553bbd4a708c03062c8d0710350ca4fac707f4e0ad9e653d4dc"
          fi

          FORCE_QUERY="${{ github.event.inputs.force == 'true' && 'force=true' || '' }}"
          KEY_QUERY="key=${SECRET_TOKEN}"
          
          # Monta os parâmetros de consulta
          if [ -n "$FORCE_QUERY" ]; then
            PARAMS="?${FORCE_QUERY}&${KEY_QUERY}"
          else
            PARAMS="?${KEY_QUERY}"
          fi
          
          # URL oficial em produção na Vercel
          TARGET_URL="https://evi-adv.vercel.app/api/cron/auto-blog${PARAMS}"
          echo "Disparando robô editorial: https://evi-adv.vercel.app/api/cron/auto-blog"
          
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer ${SECRET_TOKEN}" \
            -H "User-Agent: GitHub-Actions-Cron/1.0")
          
          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Resposta do servidor (Status $STATUS):"
          echo "$BODY"
          
          if [ "$STATUS" -ge 400 ]; then
            echo "Erro na execução do Cron: HTTP $STATUS"
            exit 1
          fi
